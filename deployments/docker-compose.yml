version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=prod
      - DATABASE_HOST=db
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_DBNAME=netflixdb
    depends_on:
      - db
    networks:
      - netflix-network

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=netflixdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - netflix-network

networks:
  netflix-network:
    driver: bridge

volumes:
  postgres_data:
